apiVersion: v1
kind: Service
metadata:
  name: {{ include "browser-platform.name" . }}
  labels:
    {{- include "browser-platform.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "browser-platform.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
