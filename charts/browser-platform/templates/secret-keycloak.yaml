{{- if not .Values.keycloak.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "browser-platform.name" . }}-keycloak
  labels:
    {{- include "browser-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  KEYCLOAK_CLIENT_SECRET: {{ required "Set keycloak.clientSecret in private values or supply keycloak.existingSecret" .Values.keycloak.clientSecret | quote }}
{{- end }}
