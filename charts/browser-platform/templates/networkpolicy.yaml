apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "browser-platform.name" . }}
  labels:
    {{- include "browser-platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "browser-platform.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress: []
