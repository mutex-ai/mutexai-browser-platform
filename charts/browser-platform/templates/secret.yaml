{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "browser-platform.name" . }}-secrets
  labels:
    {{- include "browser-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ required "Set postgres.password in private values or supply existingSecret" .Values.postgres.password | quote }}
  KEYCLOAK_CLIENT_SECRET: {{ required "Set keycloak.clientSecret in private values or supply existingSecret" .Values.keycloak.clientSecret | quote }}
  CONSOLE_CLIENT_SECRET: {{ required "Set console.clientSecret in private values or supply existingSecret" .Values.console.clientSecret | quote }}
{{- end }}
