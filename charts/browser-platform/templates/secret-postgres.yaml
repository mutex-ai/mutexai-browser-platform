{{- if not .Values.postgres.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "browser-platform.name" . }}-postgres
  labels:
    {{- include "browser-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ required "Set postgres.password in private values or supply postgres.existingSecret" .Values.postgres.password | quote }}
{{- end }}
