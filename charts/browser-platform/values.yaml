# Deployment
replicaCount: 1

image:
  registry: "" # OCI releases set this to mutexaidev.azurecr.io; local installs use a loaded image.
  repository: mutexai-browser-platform
  tag: "" # Defaults to Chart.appVersion.
  pullPolicy: IfNotPresent

imagePullSecrets: []

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    memory: 256Mi

# Application process. The private Service and container listen on port 8080.
logLevel: info
server:
  readTimeoutSec: 30
  readHeaderTimeoutSec: 5
  writeTimeoutSec: 30
  idleTimeoutSec: 120
  shutdownTimeoutSec: 30

# PostgreSQL: Platform's dedicated database and role.
postgres:
  host: "" # Required.
  port: 5432
  database: mutexai_browser_platform
  username: mutexai_browser_platform
  sslMode: verify-full
  password: "" # Private local values only; production uses existingSecret.

# Keycloak: the provisioning service account in master, not a human administrator.
keycloak:
  url: "" # Required; local Kubernetes can use its private HTTP service.
  clientId: platform-provisioner
  clientSecret: "" # Private local values only; production uses existingSecret.

# Credential source. When set, the chart does not create a Secret.
# Must contain POSTGRES_PASSWORD and KEYCLOAK_CLIENT_SECRET.
# Otherwise supply the two private values above and the chart creates its Secret.
existingSecret: ""
