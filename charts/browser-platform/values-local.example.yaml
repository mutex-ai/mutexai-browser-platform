# Copy to .local/values.yaml and supply the password for the dedicated local
# database role. This file is an example, not a production configuration.
postgres:
  host: platform-db-postgresql.mutexai-security.svc.cluster.local
  database: mutexai_browser_platform
  username: mutexai_browser_platform
  password: ""
  sslMode: disable

keycloak:
  url: http://keycloak.mutexai-security.svc.cluster.local:8080
  clientId: platform-provisioner
  clientSecret: "" # Set privately.
console:
  url: http://127.0.0.1:3000
  clientSecret: "" # One separate, random console application credential.
