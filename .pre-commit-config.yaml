repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^charts/
      - id: check-added-large-files
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.12.2
    hooks:
      - id: golangci-lint
        entry: env GOWORK=off golangci-lint run
        args: [--timeout=5m]
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: gofmt -w
        language: system
        types: [go]
      - id: helm-check
        name: Helm lint and render
        entry: make helm-check
        language: system
        pass_filenames: false
        files: ^(charts/|scripts/check-chart\.py$)
